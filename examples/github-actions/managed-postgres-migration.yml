# Private Postgres migration. Deploy a customer gateway that can reach the
# database and private DNS; the shared Cloud gateway does not enter your VPC.
# Use coordinated Action/client releases containing native TUN forwarding.
# Replace gateway, audience, private networks, resolver and database settings.
# Publish a kind="ci" policy scoped to this repository, workflow and branch,
# allowing application="psql" to 10.42.0.0/16:5432 and 10.43.0.53:53 (TCP/UDP).
# The gateway address floor must also permit those ranges with --allow-cidr.
# Database credentials/permissions remain the database's responsibility.
name: migrate (customer gateway example)
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: skimasque-dev/connect@v2
        with:
          mode: transparent
          proxy: gateway.example.com:443
          audience: https://gateway.example.com
          application: psql
          routes: 10.42.0.0/16
          dns-servers: 10.43.0.53
          dns-domains: ~internal.example
          probe-target: db.internal.example:5432
      - name: Run the migration
        run: psql "postgresql://ci@db.internal.example:5432/app" -f migrations/latest.sql
# Add IPv6 CIDRs/resolvers for services with AAAA records.
# The Action post hook removes owned routes/DNS and stops the client.
