[package]
name = "skimasque-identity"
description = "Verify workload-identity tokens (GitHub Actions OIDC) and map their claims to a skimasque-policy WorkloadIdentity."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["oidc", "workload-identity", "github-actions", "jwt", "ci"]
categories = ["authentication"]

[features]
default = ["remote"]
# Fetch OIDC discovery metadata and signing keys over HTTPS. Without it, supply
# a `JwksProvider` of your own.
remote = ["dep:reqwest"]

[dependencies]
skimasque-policy.workspace = true

serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
jsonwebtoken.workspace = true
getrandom = "0.2"
tokio = { workspace = true, features = ["sync"] }

reqwest = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
rsa = "0.9"
rand = "0.8"
base64 = "0.22"
ring.workspace = true
