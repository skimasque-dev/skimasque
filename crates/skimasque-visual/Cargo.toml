[package]
name = "skimasque-visual"
description = "SkiMasque's visual language: nodes, connections, statuses, flows and diagrams, rendered server-side for the dashboard and the website."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
stucco-core.workspace = true
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"], optional = true }

[features]
# The website generator (gallery pages). Off by default: the dashboard only
# needs the components and the stylesheet.
site = ["dep:pulldown-cmark"]

[[bin]]
name = "sitegen"
path = "src/bin/sitegen.rs"
required-features = ["site"]
