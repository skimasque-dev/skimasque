{% let g = self.arrow_geometry() %}{% let stroke = self.stroke_width() %}<span class="v-conn v-conn-{{ kind.slug() }}" style="--v-conn-length: {{ g.length }}px; --v-conn-cross: {{ g.cross() }}px; --v-conn-travel: {{ g.packet_travel() }}px"><span class="v-conn-line" aria-hidden="true">
  <svg class="v-conn-svg v-conn-horizontal" width="100%" height="100%" focusable="false">
    <g transform="translate(-{{ self.shaft_inset() }} 0)"><line x1="{{ self.shaft_start() }}" y1="{{ g.center() }}" x2="100%" y2="{{ g.center() }}" stroke="currentColor" stroke-width="{{ stroke }}" stroke-linecap="round" stroke-dasharray="{{ self.dash_pattern() }}"/></g>
    <svg x="100%" width="{{ g.cross() }}" height="{{ g.cross() }}" overflow="visible" focusable="false"><polygon points="-{{ g.head_inset() }},2 -2,{{ g.center() }} -{{ g.head_inset() }},{{ g.head_far() }}" fill="currentColor"/></svg>
  </svg>
  <svg class="v-conn-svg v-conn-vertical" width="100%" height="100%" focusable="false">
    <g transform="translate(0 -{{ self.shaft_inset() }})"><line x1="{{ g.center() }}" y1="{{ self.shaft_start() }}" x2="{{ g.center() }}" y2="100%" stroke="currentColor" stroke-width="{{ stroke }}" stroke-linecap="round" stroke-dasharray="{{ self.dash_pattern() }}"/></g>
    <svg y="100%" width="{{ g.cross() }}" height="{{ g.cross() }}" overflow="visible" focusable="false"><polygon points="2,-{{ g.head_inset() }} {{ g.center() }},-2 {{ g.head_far() }},-{{ g.head_inset() }}" fill="currentColor"/></svg>
  </svg>
</span>{% if kind.is_denied() %}<span class="v-conn-x" aria-hidden="true">×</span>{% endif %}{% if let Some(l) = label %}<span class="v-conn-label">{{ l }}</span>{% endif %}{% if !kind.spoken().is_empty() %}<span class="v-sr">{{ kind.spoken() }}</span>{% endif %}</span>
