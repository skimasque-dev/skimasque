<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }}</title><meta name="description" content="{{ description }}"><meta property="og:title" content="{{ title }}"><meta property="og:description" content="{{ description }}"><meta property="og:type" content="website"><link rel="icon" href="{{ root }}favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"><link rel="stylesheet" href="{{ root }}assets/visual.css?v={{ self.css_version() }}"></head><body class="v-site">{{ self.sprite()|safe }}<a class="v-skip" href="#main">Skip to content</a>{{ self.nav()|safe }}<main id="main">{% for p in parts %}{{ p|safe }}{% endfor %}</main>{{ self.footer()|safe }}</body></html>
