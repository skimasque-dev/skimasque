<figure class="v-layers-wrap"><ol class="v-layers{% if upward %} v-layers-up{% endif %}">{% for r in rows %}<li class="v-layer-row"><span class="v-layer-name">{{ r.title }}</span>{% if let Some(s) = r.sub %}<span class="v-layer-sub">{{ s }}</span>{% endif %}</li>{% if !loop.last %}<li class="v-layer-gap" aria-hidden="true">{% if upward %}↑{% else %}↓{% endif %}</li>{% endif %}{% endfor %}</ol><figcaption class="v-sr">{{ caption }}</figcaption></figure>
