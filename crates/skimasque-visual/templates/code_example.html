<figure class="v-code" data-copy="{{ self.copy_text() }}"><figcaption class="v-code-label">{{ label }}</figcaption><pre class="v-code-body">{% for r in self.rows() %}<span class="{{ r.class }}">{% if r.prompt %}<span class="v-code-prompt" aria-hidden="true">$ </span>{% endif %}{{ r.text }}</span>
{% endfor %}</pre></figure>
