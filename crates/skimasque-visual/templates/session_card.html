<article class="v-card v-session-card"><header class="v-card-head"><h{{ level }} class="v-card-title">{% if let Some(h) = href %}<a href="{{ h }}">{{ identity }}</a>{% else %}{{ identity }}{% endif %}</h{{ level }}>{{ self.status_html()|safe }}</header><p class="v-session-route"><span>{{ target }}</span> <span class="v-card-meta">via {{ gateway }}</span></p><div class="v-session-time"><div class="v-bar" role="progressbar" aria-label="Session time remaining" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ self.pct() }}"><span class="v-bar-fill" style="width: {{ self.pct() }}%"></span></div><span class="v-card-meta">{{ remaining_label }}</span></div></article>
