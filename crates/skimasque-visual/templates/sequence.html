<figure class="v-seq-wrap"><div class="v-seq"><div class="v-seq-actor">{{ left }}</div><div class="v-seq-actor">{{ right }}</div>{% for m in messages %}<div class="v-seq-msg {% if m.rightward %}v-seq-right{% else %}v-seq-left{% endif %}"><span class="v-seq-label">{{ m.label }}</span><span class="v-seq-arrow" aria-hidden="true">{% if m.rightward %}→{% else %}←{% endif %}</span><span class="v-sr">{{ m.spoken }}</span></div>{% endfor %}</div><figcaption class="v-sr">{{ caption }}</figcaption></figure>
