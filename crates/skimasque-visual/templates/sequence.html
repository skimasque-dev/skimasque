<figure class="v-seq-wrap"><div class="v-seq"><div class="v-seq-actor">{{ left }}</div><div class="v-seq-actor">{{ right }}</div>{% for m in messages %}<div class="v-seq-msg {% if m.rightward %}v-seq-right{% else %}v-seq-left{% endif %}"><span class="v-seq-label">{{ m.label }}</span><span class="v-seq-track" aria-hidden="true"><svg class="v-seq-arrow" viewBox="0 0 100 10" preserveAspectRatio="none" focusable="false"><path d="M0 5H100" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></span><span class="v-sr">{{ m.spoken }}</span></div>{% endfor %}</div><figcaption class="v-sr">{{ caption }}</figcaption></figure>
