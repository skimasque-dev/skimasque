<figure class="v-topology">{% if !workloads.is_empty() %}<ul class="v-topology-workloads">{% for arm in workloads %}<li>{{ arm.body|safe }}{{ arm.connection|safe }}</li>{% endfor %}</ul>{% endif %}<div class="v-topology-control">{{ control_plane|safe }}</div>{% if !networks.is_empty() %}<ul class="v-topology-networks">{% for arm in networks %}<li>{{ arm.connection|safe }}{{ arm.body|safe }}</li>{% endfor %}</ul>{% else %}<p class="v-topology-empty">No private networks configured.</p>{% endif %}<figcaption class="v-sr">{{ caption }}</figcaption></figure>
