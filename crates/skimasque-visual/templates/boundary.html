{% if self.is_firewall() %}<div class="v-boundary v-boundary-firewall" role="group" aria-label="{{ label }}"><div class="v-firewall-rule"><span class="v-boundary-label" aria-hidden="true">{{ label }}</span></div><div class="v-boundary-body">{% for c in children %}{{ c|safe }}{% endfor %}</div></div>{% else %}<div class="v-boundary v-boundary-region" role="group" aria-label="{{ label }}"><span class="v-boundary-label" aria-hidden="true">{{ label }}</span><div class="v-boundary-body">{% for c in children %}{{ c|safe }}{% endfor %}</div></div>{% endif %}
