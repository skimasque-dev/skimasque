<section class="v-hero"><div class="v-wrap v-hero-grid"><div class="v-hero-copy">{% if let Some(e) = eyebrow %}<p class="v-eyebrow">{{ e }}</p>{% endif %}<h1>{{ title }}</h1>{% for l in leads %}<p class="v-lead">{{ l }}</p>{% endfor %}{% if !ctas.is_empty() %}<p class="v-cta-row">{% for c in ctas %}<a class="v-btn{% if !c.primary %} v-btn-quiet{% endif %}" href="{{ c.href }}">{{ c.label }}</a>{% endfor %}</p>{% endif %}</div>{% if let Some(a) = aside %}<div class="v-hero-aside">{{ a|safe }}</div>{% endif %}</div></section>
