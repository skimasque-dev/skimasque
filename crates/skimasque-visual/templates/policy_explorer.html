<div class="v-explorer" role="group" aria-label="Policy explorer">{% for l in self.layers() %}<section class="v-layer" data-layer="{{ l.key }}"><p class="v-layer-title">{{ l.title }}</p>{% if l.lines.is_empty() %}<p class="v-layer-line v-layer-any">any</p>{% else %}<ul class="v-layer-lines">{% for line in l.lines %}<li>{{ line }}</li>{% endfor %}</ul>{% endif %}</section><span class="v-layer-link" aria-hidden="true">↓</span>{% endfor %}<section class="v-layer v-explorer-result">{{ self.decision_html()|safe }}<p class="v-layer-line">{{ reason }}</p></section></div>
