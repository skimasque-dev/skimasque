<div class="v-explorer" role="group" aria-label="Policy explorer">{% for l in self.layers() %}<div class="v-layer" role="group" aria-label="{{ l.title }}" data-layer="{{ l.key }}"><p class="v-layer-title" aria-hidden="true">{{ l.title }}</p>{% if l.lines.is_empty() %}<p class="v-layer-line v-layer-any">any</p>{% else %}<ul class="v-layer-lines">{% for line in l.lines %}<li>{{ line }}</li>{% endfor %}</ul>{% endif %}</div><span class="v-layer-link" aria-hidden="true">↓</span>{% endfor %}<div class="v-layer v-explorer-result" role="group" aria-label="Decision">{{ self.decision_html()|safe }}<p class="v-layer-line">{{ reason }}</p></div></div>
