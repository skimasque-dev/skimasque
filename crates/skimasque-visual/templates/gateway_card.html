<article class="v-card v-gateway-card v-tone-edge"><header class="v-card-head"><h3 class="v-card-title">{{ name }}</h3>{{ self.status_html()|safe }}</header><dl class="v-facts"><div><dt>Region</dt><dd>{{ region }}</dd></div><div><dt>Last heartbeat</dt><dd>{{ last_heartbeat }}</dd></div><div><dt>Active sessions</dt><dd>{{ sessions }}</dd></div><div><dt>Egress IP</dt><dd>{% if let Some(ip) = egress_ip %}{{ ip }}{% else %}{{ self.planned_html()|safe }}{% endif %}</dd></div></dl></article>
