<article class="v-card v-identity-card"><header class="v-card-head"><h{{ level }} class="v-card-title">{% if let Some(h) = href %}<a href="{{ h }}">{{ name }}</a>{% else %}{{ name }}{% endif %}</h{{ level }}><span class="v-card-meta">{{ source }}</span></header><p class="v-card-meta">{% if let Some(w) = last_seen %}last seen {{ w }}{% else %}never seen{% endif %} · {{ self.policy_count() }}</p></article>
