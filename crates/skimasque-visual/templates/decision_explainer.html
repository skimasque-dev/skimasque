<div class="v-explain">{% if !checks.is_empty() %}<ul class="v-checks">{% for c in checks %}<li class="v-check {% if c.pass %}v-check-pass{% else %}v-check-fail{% endif %}"><span class="v-check-glyph" aria-hidden="true">{% if c.pass %}✓{% else %}×{% endif %}</span><span class="v-check-label">{{ c.label }}</span><span class="v-check-word">{% if c.pass %}matched{% else %}did not match{% endif %}</span>{% if let Some(d) = c.detail %}<span class="v-check-detail">{{ d }}</span>{% endif %}</li>{% endfor %}</ul>{% endif %}<div class="v-explain-result">{{ self.decision_html()|safe }}<p class="v-explain-reason">{{ reason }}</p></div></div>
