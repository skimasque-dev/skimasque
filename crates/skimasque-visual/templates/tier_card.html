<article class="v-card v-tier"><header class="v-card-head"><h3 class="v-card-title">{{ name }}</h3>{% if live %}<span class="v-tier-live">Available now</span>{% endif %}</header><p class="v-tier-price">{{ price }}</p><p class="v-card-meta">{{ tagline }}</p>{% if !includes.is_empty() %}<ul class="v-tier-includes">{% for i in includes %}<li>{{ i }}</li>{% endfor %}</ul>{% endif %}{% if let Some(n) = planned %}<p class="v-run-planned"><span>{{ n }}</span> {{ self.planned_html()|safe }}</p>{% endif %}</article>
