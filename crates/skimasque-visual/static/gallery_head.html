<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Component gallery · SkiMasque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="visual.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 var(--font); }
  .g-theme { background: var(--bg); color: var(--text); padding: 32px 24px 48px; }
  .g-page { padding: 32px 24px 0; background: var(--bg); color: var(--text); }
  .g-page > h1 { font-size: 20px; margin: 0; }
  .g-page { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  .g-controls { display: flex; align-items: center; gap: 10px; }
  .g-controls[hidden] { display: none; }
  .g-controls select { font: inherit; min-height: 44px; padding: 8px 12px; color: var(--text); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-md); }
  .g-controls select:focus-visible, .g-nav a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .g-theme[hidden] { display: none; }
  .g-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
  .g-nav a { color: var(--accent-text); padding: 8px 12px; border: 1px solid var(--line-default); border-radius: var(--radius-md); text-decoration: none; }
  .g-nav a:hover { background: var(--hover); }
  .g-group { scroll-margin-top: 16px; }
  .g-preview { box-sizing: border-box; width: min(100%, var(--preview-width)); padding: 16px; border: 1px solid var(--line-strong); border-radius: var(--radius-lg); background: var(--surface); display: grid; gap: 24px; }
  .g-previews { display: grid; gap: 24px; }
  .g-preview-title { margin: 0; font-size: 13px; font-weight: 600; }
  .g-theme > h2 { font-size: 16px; margin: 0 0 4px; }
  .g-theme > p { color: var(--text-muted); margin: 0 0 24px; }
  .g-group > h3 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted);
    border-bottom: 1px solid var(--line); padding-bottom: 6px; margin: 32px 0 16px; }
  .g-items { display: flex; flex-wrap: wrap; gap: 20px 28px; align-items: flex-start; }
  .g-item { display: grid; gap: 6px; min-width: 0; max-width: 100%; }
  .g-cap { font-size: 12px; color: var(--text-muted); }
  .g-items-wide > .g-item { flex: 1 1 100%; }
  @media (max-width: 719px) { .g-page { padding: 24px 16px 0; } .g-theme { padding: 24px 16px 40px; } }
</style>
</head>
