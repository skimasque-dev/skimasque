apiVersion: v1
kind: Service
metadata:
  name: {{ include "skimasque-gateway.fullname" . }}
  labels: {{- include "skimasque-gateway.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  selector: {{- include "skimasque-gateway.selectorLabels" . | nindent 4 }}
  ports:
    # QUIC. A LoadBalancer in front of this must forward UDP.
    - name: quic
      port: {{ .Values.ports.quic }}
      targetPort: quic
      protocol: UDP
    - name: metrics
      port: {{ .Values.ports.metrics }}
      targetPort: metrics
      protocol: TCP
    {{- if .Values.tls.acme.enabled }}
    # TLS-ALPN-01. Let's Encrypt validates on 443 and nowhere else, so the
    # Service must publish 443 even though the container binds a high port.
    - name: acme
      port: 443
      targetPort: acme
      protocol: TCP
    {{- end }}
